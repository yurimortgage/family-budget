<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Семейный бюджет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<style>
/* Семейный бюджет — Telegram Mini App на GitHub Pages. Данные — в Google Таблице (через Apps Script). */
:root {
  --navy: #1f3a56; --navy-dark: #1f3a56; --orange: #4a6f96; --orange-text: #4a6f96;
  --bg: #f7f8fa; --surface: #ffffff; --fg: #22262b; --muted: #6b7280; --border: #e7e9ee;
  --chip: #f1f3f6; --plus: #2f5d50; --minus: #8a4b3c; --track: #edf0f4; --btn-navy: #1f3a56;
  --accent: #4a6f96;
  --font: "Montserrat", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
/* Всегда светлая тема — даже если на телефоне включена тёмная */
html { color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 500 15px/1.45 var(--font); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
.app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; overflow: hidden; }

header.top { background: var(--surface); border-bottom: 1px solid var(--border); padding: calc(12px + var(--top, 0px)) 16px 12px; display: flex; align-items: center; gap: 10px; flex: none; }
.logo { width: 40px; height: 40px; border-radius: 12px; flex: none; }
.brand b { display: block; font-size: 16px; font-weight: 700; color: var(--navy); line-height: 1.2; }
.brand small { color: var(--muted); font-size: 12px; font-weight: 600; }
.me { margin-left: auto; background: var(--chip); color: var(--navy); font-weight: 700; font-size: 12.5px; padding: 6px 11px; border-radius: 999px; white-space: nowrap; }

main { flex: 1; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
main > *, .sheet > * { flex-shrink: 0; }
h2 { margin: 2px 0 0; font-size: 19px; font-weight: 700; color: var(--navy); line-height: 1.2; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.link { border: 0; background: none; color: var(--orange-text); font-weight: 700; font-size: 13px; cursor: pointer; padding: 0; }

/* Карточка «всего» */
.hero { background: var(--surface); color: var(--navy); border: 1px solid var(--border);
  border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 2px; position: relative; }
.hero .label { color: var(--muted); position: relative; z-index: 1; }
.hero .big { font-size: 30px; font-weight: 700; letter-spacing: -.01em; color: var(--navy); font-variant-numeric: tabular-nums; position: relative; z-index: 1; }
.hero .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; position: relative; z-index: 1; }
.hero .row2 div { background: var(--chip); border-radius: 10px; padding: 8px 10px; }
.hero .row2 small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }
.hero .row2 b { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hero .row2 .in b { color: var(--plus); }
.hero .row2 .out b { color: var(--minus); }

.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.qb { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 9px 6px; display: flex;
  align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 13px; color: var(--navy); cursor: pointer; }
.qb .qi { font-size: 15px; font-weight: 600; color: var(--muted); line-height: 1; }
.qb:active, .fund:active, .hi:active { transform: scale(.98); }

.prog { display: flex; flex-direction: column; gap: 5px; }
.prog-top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.prog-top b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.prog-top span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { height: 3px; background: var(--track); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: #9fb3c8; }
.bar.full i { background: var(--accent); }
.sub { color: var(--muted); font-size: 12px; font-weight: 600; }

/* Фонды */
.group { display: flex; flex-direction: column; gap: 8px; }
.fund { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; display: grid;
  grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; cursor: pointer; text-align: left; width: 100%; }
.ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; background: var(--chip) !important; }
.fund .nm { font-weight: 600; color: var(--fg); font-size: 14.5px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; }
.size { display: inline-block; margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 500; }
.fund .amt { font-weight: 600; font-size: 15px; color: var(--navy); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fund .amt.neg { color: var(--minus); }
.fund .bar { grid-column: 2 / 4; height: 3px; margin-top: -2px; }

/* История */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: none; }
.chip { border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-weight: 700; font-size: 12.5px;
  padding: 7px 13px; border-radius: 999px; white-space: nowrap; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--navy); border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
.day { font-size: 12px; font-weight: 700; color: var(--muted); margin: 6px 2px -4px; text-transform: uppercase; letter-spacing: .06em; }
.hi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; cursor: pointer; }
.hi .ic { width: 34px; height: 34px; border-radius: 9px; font-size: 16px; }
.hi b { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hi small { color: var(--muted); font-size: 12px; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hi .sum { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.plus { color: var(--plus); } .minus { color: var(--minus); }
/* Компактная выписка: каждый платёж в одну строку */
.list { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%;
  padding: 10px 12px; border: 0; border-top: 1px solid var(--border); background: transparent; text-align: left; cursor: pointer; font-size: 14px; }
.row:first-child { border-top: 0; }
.row:active { background: var(--chip); }
.row .d { color: var(--muted); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.row .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); font-weight: 500; }
.row .t small { color: var(--muted); font-size: 12px; font-weight: 500; margin-left: 6px; }
.row .s { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.total { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); font-weight: 600; padding: 0 2px; }
.total b { color: var(--fg); font-variant-numeric: tabular-nums; }
.panel .list { border: 0; border-radius: 0; margin: -4px -16px -14px; border-top: 1px solid var(--border); }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; font-weight: 600; }

/* Отчёт */
.donut { display: grid; place-items: center; position: relative; }
.donut svg { width: 220px; height: 220px; transform: rotate(-90deg); }
.donut .ctr { position: absolute; text-align: center; }
.donut .ctr small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
.donut .ctr b { font-size: 22px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-direction: column; gap: 9px; }
.lg { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; font-size: 14px; }
.lg i { width: 12px; height: 12px; border-radius: 4px; }
.lg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lg em { font-style: normal; color: var(--muted); font-size: 12px; font-weight: 700; }
.lg b { font-variant-numeric: tabular-nums; }
.rows { display: flex; flex-direction: column; gap: 8px; font-variant-numeric: tabular-nums; }
.r { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.r b { white-space: nowrap; }
hr { border: 0; border-top: 1px solid var(--border); margin: 2px 0; width: 100%; }

/* Нижнее меню */
nav.tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs button { border: 0; background: transparent; padding: 8px 2px 10px; font-weight: 600; font-size: 11px; color: #9aa1ab;
  display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
nav.tabs button svg { width: 21px; height: 21px; stroke-width: 1.7; }
nav.tabs button[aria-selected="true"] { color: var(--navy); }
nav.tabs .add { position: relative; }
nav.tabs .add span.plusbtn { width: 38px; height: 38px; margin-top: 2px; border-radius: 50%; background: var(--navy); color: #fff;
  display: grid; place-items: center; font-size: 22px; font-weight: 400; }

/* Лист снизу */
.sheet-bg { position: absolute; inset: 0; background: rgba(8, 18, 32, .45); display: flex; align-items: flex-end; z-index: 10; }
.sheet { background: var(--bg); width: 100%; border-radius: 22px 22px 0 0; padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  max-height: calc(100% - var(--top, 0px) - 24px); overflow-y: auto; display: flex; flex-direction: column; gap: 14px; position: relative; }
.sheet .x { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 0;
  background: var(--chip); color: var(--muted); font-size: 16px; line-height: 1; display: grid; place-items: center; cursor: pointer; z-index: 1; }
.sheet h3 { padding-right: 40px; }
.grab { width: 40px; height: 5px; border-radius: 9px; background: var(--border); align-self: center; }
.sheet h3 { margin: 0; font-size: 19px; color: var(--navy); font-weight: 800; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: var(--chip); padding: 4px; border-radius: 12px; }
.seg.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.seg button { border: 0; background: transparent; color: var(--muted); font-weight: 700; font-size: 13px; padding: 9px 4px; border-radius: 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--navy); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.amount { display: flex; align-items: baseline; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; }
.amount:focus-within { border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange); }
.amount span { font: 600 22px var(--font); color: var(--muted); }
.amount input { border: 0; outline: none; background: transparent; color: var(--navy); font: 700 28px var(--font); width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.fpick { border: 1px solid var(--border); background: var(--surface); border-radius: 13px; padding: 9px 10px; display: grid;
  grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: center; text-align: left; cursor: pointer; }
.fpick .e { font-size: 20px; text-align: center; }
.fpick b { display: block; font-size: 12.5px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
.fpick small { color: var(--muted); font-size: 11px; font-weight: 600; }
.fpick[aria-pressed="true"] { border-color: var(--orange); box-shadow: inset 0 0 0 1px var(--orange); }
.input:focus, select:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange); }
.input, select { border: 1px solid var(--border); background: var(--surface); color: var(--fg); border-radius: 13px; padding: 12px 13px; font: 600 15px var(--font); width: 100%; }
.cta { border: 0; background: var(--navy); color: #fff; font: 600 15px var(--font); padding: 13px; border-radius: 12px; cursor: pointer; width: 100%; }
.cta.navy { background: var(--btn-navy); }
.cta.ghost { background: transparent; color: var(--navy); border: 1px solid var(--border); }
.cta:disabled { opacity: .55; }
.err { color: var(--orange-text); font-size: 13px; font-weight: 700; }
.hint { color: var(--muted); font-size: 12.5px; font-weight: 600; margin: -6px 2px 0; }
.toast { position: absolute; left: 16px; right: 16px; top: calc(76px + var(--top, 0px)); background: var(--navy-dark); color: #fff; font-weight: 700; padding: 13px 16px;
  border-radius: 14px; z-index: 20; box-shadow: 0 10px 30px rgba(0,0,0,.25); text-align: center; }
.skel { background: var(--track); border-radius: 16px; height: 120px; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(30px); opacity: .5; } }
  .toast { animation: down .2s ease-out; } @keyframes down { from { transform: translateY(-16px); opacity: 0; } }
  .skel { animation: pulse 1.2s infinite; } @keyframes pulse { 50% { opacity: .5; } }
}
@media (max-width: 360px) { .hero .big { font-size: 28px; } .fgrid { grid-template-columns: 1fr; } nav.tabs button { font-size: 10px; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <rect width="40" height="40" rx="11" fill="#1f3a56"/>
      <path d="M12.5 20.5l7.5-6.5 7.5 6.5v7.5h-15z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
      <path d="M18 28v-4.5h4V28" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    </svg>
    <div class="brand"><b>Семейный бюджет</b><small id="monthLbl">…</small></div>
    <div class="me" id="meLbl"></div>
  </header>

  <main id="pane-home"><div class="skel"></div><div class="skel" style="height:70px"></div><div class="skel" style="height:220px"></div></main>
  <main id="pane-funds" hidden></main>
  <main id="pane-hist" hidden></main>
  <main id="pane-report" hidden></main>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg>Главная</button>
    <button role="tab" data-tab="funds" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>Фонды</button>
    <button class="add" data-add="1" aria-label="Добавить запись"><span class="plusbtn">+</span></button>
    <button role="tab" data-tab="hist" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>История</button>
    <button role="tab" data-tab="report" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Отчёт</button>
  </nav>
  <div id="sheet" hidden></div>
  <div id="toast" class="toast" hidden></div>
</div>

<script>
// Адрес «склада данных» — веб-приложение Google Apps Script
const API_URL = "https://script.google.com/macros/s/AKfycbw7XbJepph5fRrb60aJm8AMapnsvcpIwwcyh86hhHfI70N4zlmxFYNjCfZ_sA31WPJ5/exec";
const tg = window.Telegram && window.Telegram.WebApp;
let AUTH = null;
const S = { tab: "home", data: null, filter: "all", busy: false };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (n, sign) => {
  const v = Math.abs(Math.round(n * 100) / 100);
  const s = "$" + v.toLocaleString("en-US", { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
  return (n < 0 ? "−" : sign && n > 0 ? "+" : "") + s;
};
const soft = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const fundBy = name => (S.data.funds || []).find(f => f.name === name);
const MUTED = ["#9aa5b1", "#5b7c99", "#c9a27e", "#b98a86", "#8fb3ad", "#93a886", "#d4c38f", "#a895b0",
  "#d1aeb3", "#a8927f", "#6f8197", "#9c8aa8", "#7fa8a8", "#c79a95", "#8c86a8", "#b597a5"];
function mute(d) { (d.funds || []).forEach((f, i) => { f.color = MUTED[i % MUTED.length]; }); return d; }

const API_NAMES = { apiData: "data", apiAdd: "add", apiTransfer: "transfer", apiUndo: "undo" };
function call(fn, arg) {
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },   // простой запрос — Google его принимает
    body: JSON.stringify({ api: API_NAMES[fn], auth: AUTH, data: arg === undefined ? null : arg }),
  }).then(r => r.json()).catch(() => { throw new Error("Нет связи с сервером"); })
    .then(j => { if (!j || !j.ok) throw new Error((j && j.error) || "Ошибка сервера"); return j.data; });
}
function haptic(type) { try { tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }
function toast(text) {
  const t = $("#toast"); t.textContent = text; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2200);
}

// ---------- Экраны ----------
function render() {
  const d = S.data; if (!d) return;
  $("#monthLbl").textContent = d.month;
  $("#meLbl").textContent = "👤 " + d.me.name;
  document.querySelectorAll("nav.tabs [role=tab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
  ["home", "funds", "hist", "report"].forEach(t => { $("#pane-" + t).hidden = t !== S.tab; });
  ({ home: renderHome, funds: renderFunds, hist: renderHist, report: renderReport })[S.tab]();
  syncBack();
}

function progRow(f) {
  const pct = f.value > 0 ? Math.max(0, Math.min(100, f.balance / f.value * 100)) : 0;
  return `<div class="prog"><div class="prog-top"><span>${f.icon} ${esc(f.name)}</span><b class="${f.balance < 0 ? "minus" : ""}">${money(f.balance)} <span class="sub">из ${money(f.value)}</span></b></div>
    <div class="bar ${pct >= 100 ? "full" : ""}"><i style="width:${pct}%"></i></div></div>`;
}

function renderHome() {
  const d = S.data;
  const fixed = d.funds.filter(f => f.kind === "fixed");
  const last = d.history.slice(0, 5);
  $("#pane-home").innerHTML = `
    <section class="hero">
      <span class="label">Всего во всех фондах</span>
      <span class="big">${money(d.total)}</span>
      <div class="row2"><div class="in"><small>Доходы · ${esc(d.monthName.toLowerCase())}</small><b>${money(d.income)}</b></div>
        <div class="out"><small>Расходы · ${esc(d.monthName.toLowerCase())}</small><b>${money(d.spent)}</b></div></div>
    </section>
    <div class="quick">
      <button class="qb exp" data-add="exp"><span class="qi">−</span>Расход</button>
      <button class="qb inc" data-add="inc"><span class="qi">+</span>Доход</button>
      <button class="qb tr" data-add="tr"><span class="qi">⇄</span>Перевод</button>
    </div>
    <section class="panel">
      <div class="panel-h"><span class="label">Постоянные фонды</span><span class="sub">пополнено ${money(d.fixedGot)} из ${money(d.fixedTarget)}</span></div>
      ${fixed.map(progRow).join("")}
    </section>
    <section class="panel">
      <div class="panel-h"><span class="label">Последние записи</span><button class="link" data-goto="hist">Вся история →</button></div>
      ${last.length ? `<div class="list">${last.map(rowItem).join("")}</div>` : `<div class="empty">Пока нет записей.<br>Нажмите «+», чтобы добавить.</div>`}
    </section>`;
}

function fundCard(f) {
  const bar = f.kind === "fixed" && f.value > 0
    ? `<div class="bar ${f.balance >= f.value ? "full" : ""}"><i style="width:${Math.max(0, Math.min(100, f.balance / f.value * 100))}%"></i></div>` : "";
  return `<button class="fund" data-fund="${esc(f.name)}">
    <span class="ic" style="background:${soft(f.color, .16)}">${f.icon}</span>
    <span><span class="nm">${esc(f.name)}</span><br><span class="size">${esc(f.size)}</span></span>
    <span class="amt ${f.balance < 0 ? "neg" : ""}">${money(f.balance)}</span>${bar}</button>`;
}

function renderFunds() {
  const d = S.data;
  const grp = (title, list) => list.length ? `<div class="group"><span class="label">${title}</span>${list.map(fundCard).join("")}</div>` : "";
  $("#pane-funds").innerHTML = `<h2>Фонды</h2>
    ${grp("Постоянные — сумма в месяц", d.funds.filter(f => f.kind === "fixed"))}
    ${grp("Накопительные — % от дохода", d.funds.filter(f => f.kind === "fund"))}
    ${grp("Налоги", d.funds.filter(f => f.kind === "tax"))}`;
}

function histIcon(h) {
  if (h.type === "inc") return { e: h.noTax ? "💼" : "💵", c: "#14416b" };
  if (h.type === "tr") return { e: "⇄", c: "#7F8C8D" };
  const f = fundBy(h.fund); return { e: f ? f.icon : "•", c: f ? f.color : "#7F8C8D" };
}
function histItem(h) {
  const ic = histIcon(h);
  let title, sub, sum;
  if (h.type === "inc") { title = h.noTax ? "Зарплата" : "Комиссия / доход"; sub = String(h.comment || "").replace(/^(зп|комиссия)\s*/i, ""); sum = `<span class="sum plus">${money(h.amount, true)}</span>`; }
  else if (h.type === "exp") { title = h.comment || h.fund; sub = h.fund; sum = `<span class="sum minus">${money(-h.amount)}</span>`; }
  else if (h.type === "tr") { title = "Перевод"; sub = `${h.from} → ${h.to}`; sum = `<span class="sum">${money(h.amount)}</span>`; }
  else { title = "Запись"; sub = ""; sum = ""; }
  return `<button class="hi" data-op="${esc(h.op)}">
    <span class="ic" style="background:${soft(ic.c, .14)}">${ic.e}</span>
    <span><b>${esc(title)}</b><small>${esc([sub, h.who, h.when].filter(Boolean).join(" · "))}</small></span>${sum}</button>`;
}

function rowItem(h) {
  let title, sub, sum;
  if (h.type === "inc") { title = String(h.comment || "").replace(/^(зп|комиссия)\s*/i, "") || (h.noTax ? "Зарплата" : "Доход"); sub = h.noTax ? "зарплата" : "доход"; sum = `<span class="s plus">${money(h.amount, true)}</span>`; }
  else if (h.type === "exp") { title = h.comment || h.fund; sub = h.comment ? h.fund : ""; sum = `<span class="s minus">${money(-h.amount)}</span>`; }
  else if (h.type === "tr") { title = `${h.from} → ${h.to}`; sub = "перевод"; sum = `<span class="s">${money(h.amount)}</span>`; }
  else { title = "Запись"; sub = ""; sum = ""; }
  return `<button class="row" data-op="${esc(h.op)}"><span class="d">${esc(String(h.when || "").slice(0, 5))}</span>
    <span class="t">${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ""}</span>${sum}</button>`;
}

function renderHist() {
  const d = S.data;
  const f = S.filter;
  const list = d.history.filter(h => f === "all" || (f === "mine" && h.mine) || h.type === f);
  const chip = (v, t) => `<button class="chip" data-filter="${v}" aria-pressed="${f === v}">${t}</button>`;
  const out = list.filter(h => h.type === "exp").reduce((a, h) => a + h.amount, 0);
  const inc = list.filter(h => h.type === "inc").reduce((a, h) => a + h.amount, 0);
  let html = `<h2>История</h2><div class="chips">${chip("all", "Все")}${chip("mine", "Мои")}${chip("exp", "Расходы")}${chip("inc", "Доходы")}${chip("tr", "Переводы")}</div>`;
  if (!list.length) html += `<div class="empty">Здесь пока пусто</div>`;
  else {
    html += `<div class="total"><span>${list.length} ${plural(list.length, "запись", "записи", "записей")}</span>
      <span>${inc ? `доходы <b class="plus">${money(inc)}</b> · ` : ""}${out ? `расходы <b class="minus">${money(out)}</b>` : ""}</span></div>`;
    html += `<div class="list">${list.map(rowItem).join("")}</div>`;
  }
  $("#pane-hist").innerHTML = html;
}
function plural(n, one, few, many) {
  const a = n % 10, b = n % 100;
  return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many;
}
function dayLabel(iso) {
  const [y, m, dd] = iso.split("-").map(Number);
  const months = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  return `${dd} ${months[m - 1]}`;
}

function renderReport() {
  const d = S.data;
  const items = d.funds.filter(f => f.spentMonth > 0).sort((a, b) => b.spentMonth - a.spentMonth);
  const total = items.reduce((s, f) => s + f.spentMonth, 0);
  const R = 70, C = 2 * Math.PI * R;
  let off = 0;
  const arcs = items.map(f => {
    const len = total ? f.spentMonth / total * C : 0;
    const gap = items.length > 1 ? Math.min(2, len / 3) : 0;
    const a = `<circle r="${R}" cx="110" cy="110" fill="none" stroke="${f.color}" stroke-width="22" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}"/>`;
    off += len; return a;
  }).join("");
  const pct = v => total ? Math.round(v / total * 100) + "%" : "";
  $("#pane-report").innerHTML = `<h2>Отчёт · ${esc(d.month)}</h2>
    <section class="panel">
      <span class="label">Расходы по фондам</span>
      ${items.length ? `<div class="donut"><svg viewBox="0 0 220 220"><circle r="${R}" cx="110" cy="110" fill="none" stroke="var(--track)" stroke-width="22"/>${arcs}</svg>
        <div class="ctr"><small>потрачено</small><b>${money(total)}</b></div></div>
        <div class="legend">${items.map(f => `<div class="lg"><i style="background:${f.color}"></i><span>${f.icon} ${esc(f.name)} <em>(${esc(f.size)})</em></span><em>${pct(f.spentMonth)}</em><b>${money(f.spentMonth)}</b></div>`).join("")}</div>`
        : `<div class="empty">В этом месяце расходов пока нет</div>`}
    </section>
    <section class="panel">
      <span class="label">Итоги месяца</span>
      <div class="rows">
        <div class="r"><span>💵 Доходы</span><b class="plus">${money(d.income)}</b></div>
        <div class="r"><span>🏛 Налоги отложено</span><b>${money(d.tax)}</b></div>
        <div class="r"><span>🏠 Постоянные пополнены</span><b>${money(d.fixedGot)} / ${money(d.fixedTarget)}</b></div>
        <div class="r"><span>🗂 В накопительные</span><b>${money(d.funds.filter(f => f.kind === "fund").reduce((s, f) => s + f.allocMonth, 0))}</b></div>
        <hr><div class="r"><span>➖ Расходы</span><b class="minus">${money(d.spent)}</b></div>
      </div>
    </section>`;
}

// ---------- Листы: добавить, фонд, запись ----------
const F = { mode: "exp", fund: null, noTax: true, from: null, to: null };
function openSheet(html) {
  const s = $("#sheet");
  s.innerHTML = `<div class="sheet-bg" data-close="1"><div class="sheet"><div class="grab"></div>
    <button class="x" data-close="1" aria-label="Закрыть">✕</button>${html}</div></div>`;
  s.hidden = false; syncBack();
}
function closeSheet() { $("#sheet").hidden = true; $("#sheet").innerHTML = ""; syncBack(); }
// Кнопка «Назад» Telegram: закрывает окно, а с других вкладок возвращает на главную
function syncBack() {
  if (!tg || !tg.BackButton) return;
  try { (!$("#sheet").hidden || S.tab !== "home") ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
}
function goBack() {
  if (!$("#sheet").hidden) return closeSheet();
  if (S.tab !== "home") { S.tab = "home"; render(); }
}

function openAdd(mode, fund) {
  F.mode = mode || F.mode; if (fund) { F.fund = fund; F.from = fund; }
  const d = S.data;
  const spendable = d.funds.filter(f => f.kind !== "tax");
  const seg = (v, t) => `<button data-mode="${v}" aria-pressed="${F.mode === v}">${t}</button>`;
  let body = "";
  if (F.mode === "exp") {
    body = `<span class="label">Из какого фонда</span><div class="fgrid">${spendable.map(f =>
      `<button class="fpick" data-pick="${esc(f.name)}" aria-pressed="${F.fund === f.name}"><span class="e">${f.icon}</span><span><b>${esc(f.name)}</b><small>${money(f.balance)} · ${esc(f.size)}</small></span></button>`).join("")}</div>
      <input class="input" id="fComment" maxlength="200" placeholder="Комментарий: Publix, кружок, бензин…">`;
  } else if (F.mode === "inc") {
    body = `<div class="seg two"><button data-notax="1" aria-pressed="${F.noTax}">💼 Зарплата</button><button data-notax="0" aria-pressed="${!F.noTax}">💵 Комиссия</button></div>
      <p class="hint">${F.noTax ? "Налог уже удержан — 10% не снимаю." : "Отложу 10% на налоги."} Остальное разложу по фондам.</p>
      <input class="input" id="fComment" maxlength="200" placeholder="Комментарий: сделка Smith, аванс…">`;
  } else {
    const opts = sel => d.funds.map(f => `<option value="${esc(f.name)}" ${sel === f.name ? "selected" : ""}>${f.icon} ${esc(f.name)} (${esc(f.size)}) · ${money(f.balance)}</option>`).join("");
    body = `<span class="label">Откуда</span><select id="fFrom">${opts(F.from || spendable[0].name)}</select>
      <span class="label">Куда</span><select id="fTo">${opts(F.to || (d.funds.find(f => f.name === "Резерв") || spendable[1]).name)}</select>
      <input class="input" id="fComment" maxlength="200" placeholder="Комментарий (необязательно)">`;
  }
  openSheet(`<h3>${F.mode === "exp" ? "Новый расход" : F.mode === "inc" ? "Новый доход" : "Перевод между фондами"}</h3>
    <div class="seg">${seg("exp", "➖ Расход")}${seg("inc", "➕ Доход")}${seg("tr", "⇄ Перевод")}</div>
    <label class="amount"><span>$</span><input id="fAmount" inputmode="decimal" placeholder="0" autocomplete="off"></label>
    ${body}<div class="err" id="fErr"></div>
    <button class="cta ${F.mode === "inc" ? "navy" : ""}" id="fSave">${F.mode === "tr" ? "Перевести" : "Записать"}</button>`);
  setTimeout(() => { const a = $("#fAmount"); if (a) a.focus(); }, 150);
}

function save() {
  if (S.busy) return;
  const amount = Number(String($("#fAmount").value).replace(",", ".").replace(/[^\d.]/g, ""));
  const comment = ($("#fComment") || {}).value || "";
  const err = $("#fErr");
  if (!(amount > 0)) { err.textContent = "Введите сумму"; return; }
  let p;
  if (F.mode === "exp") {
    if (!F.fund) { err.textContent = "Выберите фонд"; return; }
    p = call("apiAdd", { type: "exp", amount, fund: F.fund, comment });
  } else if (F.mode === "inc") {
    p = call("apiAdd", { type: "inc", amount, noTax: F.noTax, comment });
  } else {
    const from = $("#fFrom").value, to = $("#fTo").value;
    if (from === to) { err.textContent = "Выберите два разных фонда"; return; }
    p = call("apiTransfer", { from, to, amount, comment });
  }
  S.busy = true; $("#fSave").disabled = true; $("#fSave").textContent = "Записываю…";
  p.then(d => { S.data = mute(d); S.busy = false; closeSheet(); render(); toast("✅ Записано · " + money(amount)); haptic("success"); F.fund = null; })
   .catch(e => { S.busy = false; const b = $("#fSave"); if (b) { b.disabled = false; b.textContent = "Записать"; } err.textContent = (e && e.message) || "Не получилось, попробуйте ещё раз"; });
}

function openFund(name) {
  const f = fundBy(name); if (!f) return;
  const hist = S.data.history.filter(h => h.fund === name || h.from === name || h.to === name).slice(0, 6);
  openSheet(`<div style="display:flex;gap:12px;align-items:center"><span class="ic" style="background:${soft(f.color, .16)};width:52px;height:52px;font-size:26px">${f.icon}</span>
      <div><h3>${esc(f.name)}</h3><span class="size">${esc(f.size)}</span></div></div>
    <section class="panel"><div class="rows">
      <div class="r"><span>Остаток</span><b class="${f.balance < 0 ? "minus" : ""}" style="font-size:18px">${money(f.balance)}</b></div>
      <div class="r"><span>Пришло за месяц</span><b>${money(f.allocMonth)}</b></div>
      <div class="r"><span>Потрачено за месяц</span><b>${money(f.spentMonth)}</b></div></div></section>
    ${hist.length ? `<span class="label">Последние записи</span><div class="list">${hist.map(rowItem).join("")}</div>` : ""}
    ${f.kind !== "tax" ? `<button class="cta" data-add="exp" data-fundpre="${esc(f.name)}">➖ Расход из этого фонда</button>` : ""}
    <button class="cta ghost" data-add="tr" data-fundpre="${esc(f.name)}">⇄ Перевести в другой фонд</button>`);
}

function openOp(op) {
  const h = S.data.history.find(x => x.op === op); if (!h) return;
  const ic = histIcon(h);
  const what = h.type === "inc" ? `Доход ${money(h.amount)}` : h.type === "exp" ? `Расход ${money(h.amount)} · ${h.fund}` : `Перевод ${money(h.amount)}: ${h.from} → ${h.to}`;
  openSheet(`<div style="display:flex;gap:12px;align-items:center"><span class="ic" style="background:${soft(ic.c, .14)};width:52px;height:52px;font-size:24px">${ic.e}</span>
      <div><h3>${esc(what)}</h3><span class="sub">${esc([String(h.comment || "").replace(/^(зп|комиссия)\s*/i, ""), h.who, h.when].filter(Boolean).join(" · "))}</span></div></div>
    ${h.mine ? `<button class="cta" id="undoBtn" data-undo="${esc(h.op)}">↩️ Отменить эту запись</button>`
             : `<p class="hint" style="margin:0">Отменить запись может только тот, кто её сделал (${esc(h.who)}).</p>`}
    <button class="cta ghost" data-close="1">Закрыть</button>`);
}

function undo(op) {
  if (S.busy) return; S.busy = true;
  const b = $("#undoBtn"); if (b) { b.disabled = true; b.textContent = "Отменяю…"; }
  call("apiUndo", op).then(d => { S.data = mute(d); S.busy = false; closeSheet(); render(); toast("↩️ Запись отменена"); })
    .catch(e => { S.busy = false; if (b) { b.disabled = false; b.textContent = "↩️ Отменить эту запись"; } toast((e && e.message) || "Не получилось"); });
}

// ---------- События ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-close]");
  if (!t) return;
  if (t.dataset.close && (e.target === t || t.tagName === "BUTTON")) return closeSheet();
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); $("#pane-" + S.tab).scrollTop = 0; return; }
  if (t.dataset.goto) { S.tab = t.dataset.goto; render(); return; }
  if (t.dataset.add) {
    const pre = t.dataset.fundpre;
    if (t.dataset.add === "tr") { F.from = pre || null; F.to = null; }
    return openAdd(t.dataset.add === "1" ? (F.mode || "exp") : t.dataset.add, t.dataset.add === "exp" ? pre : null);
  }
  if (t.dataset.mode) { const a = $("#fAmount").value; openAdd(t.dataset.mode); $("#fAmount").value = a; return; }
  if (t.dataset.pick) { F.fund = t.dataset.pick; document.querySelectorAll(".fpick").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.pick === F.fund))); return; }
  if (t.dataset.notax) { const a = $("#fAmount").value; F.noTax = t.dataset.notax === "1"; openAdd("inc"); $("#fAmount").value = a; return; }
  if (t.id === "fSave") return save();
  if (t.dataset.fund) return openFund(t.dataset.fund);
  if (t.dataset.op) return openOp(t.dataset.op);
  if (t.dataset.undo) return undo(t.dataset.undo);
  if (t.dataset.filter) { S.filter = t.dataset.filter; renderHist(); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !$("#sheet").hidden && e.target.tagName === "INPUT") save();
  if (e.key === "Escape" && !$("#sheet").hidden) closeSheet();
});

// ---------- Старт ----------
function showLocked() {
  $("#pane-home").innerHTML = `<section class="panel" style="text-align:center;gap:10px;padding:28px 18px">
    <div style="font-size:40px">🔒</div><h2>Откройте через Telegram</h2>
    <p class="sub" style="margin:0">Приложение открывается кнопкой <b>«Open»</b> у бота или <b>«📱 Бюджет»</b> в чате. Если не открывается — отправьте боту <b>/start</b>.</p></section>`;
  $("nav.tabs").hidden = true;
}
function load() {
  call("apiData").then(d => { S.data = mute(d); render(); })
    .catch(e => {
      const keys = AUTH && AUTH.init ? AUTH.init.split("&").map(kv => kv.split("=")[0]).join(", ") : "";
      $("#pane-home").innerHTML = `<section class="panel"><b>Не удалось загрузить данные</b><span class="sub">${esc((e && e.message) || "")}</span>
        ${keys ? `<span class="sub">Проверка: ${esc(keys)}</span>` : ""}
        <button class="cta" onclick="location.reload()">Обновить</button></section>`;
    });
}
// Telegram: белая шапка, на весь экран, отступ под кнопки «✕» и «⋯»
function insets() {
  const top = tg && tg.isFullscreen ? ((tg.safeAreaInset || {}).top || 0) + ((tg.contentSafeAreaInset || {}).top || 0) : 0;
  document.documentElement.style.setProperty("--top", top + "px");
}
if (tg) {
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { tg.setHeaderColor("#ffffff"); tg.setBackgroundColor("#f7f8fa"); if (tg.setBottomBarColor) tg.setBottomBarColor("#ffffff"); } catch (e) {}
  try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
  try { if (tg.isVersionAtLeast && tg.isVersionAtLeast("8.0") && ["ios", "android", "android_x"].indexOf(tg.platform) >= 0) tg.requestFullscreen(); } catch (e) {}
  ["fullscreenChanged", "safeAreaChanged", "contentSafeAreaChanged"].forEach(ev => { try { tg.onEvent(ev, insets); } catch (e) {} });
  try { tg.BackButton.onClick(goBack); } catch (e) {}
}
insets();

// Кто открыл: данные, подписанные Telegram, или личная ссылка из кнопки в чате (?u=…&k=…)
const q = new URLSearchParams(location.search);
if (tg && tg.initData) AUTH = { init: tg.initData };
else if (q.get("u") && q.get("k")) AUTH = { u: q.get("u"), k: q.get("k") };
AUTH ? load() : showLocked();
</script>
</body>
</html>
